<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ book.title }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 50px 20px; }
        .card { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        h1 { color: #0f172a; margin-top: 0; }
        p { line-height: 1.6; color: #475569; }
        .back-link { display: inline-block; margin-top: 20px; color: #4f46e5; text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .book-img { max-width: 100%; height: auto; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="card">
        {% if book.image %}
            <img src="{{ book.image.url }}" alt="{{ book.title }}" class="book-img">
        {% endif %}
        <h1>{{ book.title }}</h1>
        <p>{{ book.description }}</p> <!-- Agar modellaringizda description bo'lsa -->
        
        <a href="{% url 'books' %}" class="back-link">← Ortga qaytish</a>
    </div>
</body>
</html>
