<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Ro'yxatdan o'tish</title>
    <style>
        body {
            background-color: #fdfbf7; /* Ivory rangi */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .auth-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.2);
            width: 100%;
            max-width: 400px;
            border: 1px solid #ffe4e1;
        }
        h2 {
            text-align: center;
            color: #d87093;
            margin-bottom: 24px;
        }
        form p {
            margin-bottom: 16px;
        }
        form label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
            font-weight: 600;
        }
        form input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffc0cb;
            border-radius: 8px;
            background-color: #fffaf0;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        form input:focus {
            border-color: #d87093;
            box-shadow: 0 0 5px rgba(216, 112, 147, 0.3);
        }
        .helptext, ul.errorlist {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
            padding-left: 0;
            list-style: none;
        }
        ul.errorlist {
            color: #ff6b6b;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffb6c1; /* Och pushti */
            color: #5a2e38;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #ff91a4;
        }
        .footer-text {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }
        .footer-text a {
            color: #d87093;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2>Ro'yxatdan o'tish</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Tasdiqlash</button>
        </form>
        <div class="footer-text">
            Hisobingiz bormi? <a href="{% url 'login' %}">Kirish</a>
        </div>
    </div>

</body>
</html>
